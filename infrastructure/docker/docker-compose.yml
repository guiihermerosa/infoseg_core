version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=InfoSeg@2024!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC (WHEP)
      - "8890:8890"   # WebRTC (WHIP)
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=sqlserver://sa:InfoSeg@2024!@sqlserver:1433;database=infoseg_core;encrypt=true;trustServerCertificate=true
      - JWT_SECRET=infoseg-jwt-secret-production-change-me
      - JWT_EXPIRES_IN=8h
      - STORAGE_TYPE=local
      - MEDIAMTX_URL=http://mediamtx:8889
      - ENCRYPTION_KEY=infoseg-encryption-key-change-me-32ch
      - PORT=3001
    depends_on:
      - sqlserver
      - mediamtx
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
      - NEXT_PUBLIC_MEDIAMTX_URL=http://localhost:8889
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
